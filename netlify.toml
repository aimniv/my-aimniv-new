[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# SPA fallback so direct visits to /admin (and other paths) load the app.
# Function paths (/api/admin/*) are matched before this rule.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
